  - id: "day01-ex5"
    title: "Business Data Type Checker"
    description: |
      Create a function that returns the data type of a value as a string.

      For example:
      - 100 → "int"
      - 99.99 → "float"
      - "Hello" → "str"
      - True → "bool"
    difficulty: medium
    points: 15
    starter_code: |
      def get_data_type(value):
          """
          Return the data type of the value as a string.

          Args:
              value: Any Python value

          Returns:
              The type name as a string (e.g., "int", "str", "float", "bool")
          """
          # Your code here
          # Hint: type(value).__name__ gives you the type as a string
          pass
    function_name: get_data_type
    test_cases:
      - input: [1500]
        expected_return: "int"
      - input: [49.99]
        expected_return: "float"
      - input: ["InnovateCorp"]
        expected_return: "str"
      - input: [true]
        expected_return: "bool"
    hints:
      - "Use the type() function to get the type"
      - "The __name__ attribute gives you the type as a string"
      - "Example: type(42).__name__ returns 'int'"
    solution: |
      def get_data_type(value):
          return type(value).__name__
