  - id: "day01-ex1"
    title: "Company Welcome Message"
    description: |
      Create a function that generates a welcome message for a company.
      The function should return a string in the format:
      "Welcome to {company_name} Analytics"
    difficulty: easy
    points: 10
    starter_code: |
      def welcome_company(company_name):
          """
          Generate a welcome message for a company.

          Args:
              company_name: The name of the company

          Returns:
              A welcome message string
          """
          # Your code here - use an f-string or string concatenation
          pass
    function_name: welcome_company
    test_cases:
      - input: ["InnovateCorp"]
        expected_return: "Welcome to InnovateCorp Analytics"
      - input: ["TechStartup"]
        expected_return: "Welcome to TechStartup Analytics"
      - input: ["Global Solutions"]
        expected_return: "Welcome to Global Solutions Analytics"
    hints:
      - "Use an f-string: f\"Welcome to {company_name} Analytics\""
      - "Make sure to return the string, not print it"
      - "The format is exactly: 'Welcome to ' + name + ' Analytics'"
    solution: |
      def welcome_company(company_name):
          return f"Welcome to {company_name} Analytics"

  - id: "day01-ex2"
    title: "Calculate Gross Profit"
    description: |
      Create a function that calculates gross profit from revenue and
      cost of goods sold (COGS).

      Gross Profit = Revenue - COGS
    difficulty: easy
    points: 10
    starter_code: |
      def calculate_gross_profit(revenue, cogs):
          """
          Calculate the gross profit.

          Args:
              revenue: Total sales revenue
              cogs: Cost of Goods Sold

          Returns:
              The gross profit (revenue - cogs)
          """
          # Your code here
          pass
    function_name: calculate_gross_profit
    test_cases:
      - input: [500000, 350000]
        expected_return: "150000"
      - input: [100000, 60000]
        expected_return: "40000"
      - input: [1000000, 750000]
        expected_return: "250000"
    hints:
      - "Gross profit is simply revenue minus COGS"
      - "Return the result of the subtraction"
    solution: |
      def calculate_gross_profit(revenue, cogs):
          return revenue - cogs

  - id: "day01-ex3"
    title: "Calculate Profit Margin"
    description: |
      Create a function that calculates the gross profit margin percentage.

      Profit Margin = (Gross Profit / Revenue) × 100

      Handle the edge case where revenue is 0 (return 0 in that case).
    difficulty: medium
    points: 15
    starter_code: |
      def calculate_profit_margin(gross_profit, revenue):
          """
          Calculate the profit margin as a percentage.

          Args:
              gross_profit: The gross profit amount
              revenue: Total revenue

          Returns:
              The profit margin percentage (0-100)
          """
          # Your code here
          # Remember to handle division by zero!
          pass
    function_name: calculate_profit_margin
    test_cases:
      - input: [150000, 500000]
        expected_return: "30.0"
      - input: [40000, 100000]
        expected_return: "40.0"
      - input: [0, 0]
        expected_return: "0"
      - input: [25000, 100000]
        expected_return: "25.0"
    hints:
      - "First check if revenue is 0 to avoid division by zero"
      - "The formula is: (gross_profit / revenue) * 100"
      - "Use an if statement: if revenue == 0: return 0"
    solution: |
      def calculate_profit_margin(gross_profit, revenue):
          if revenue == 0:
              return 0
          return (gross_profit / revenue) * 100

