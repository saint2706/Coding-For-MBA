name: Node bootstrap
description: Configure Node.js and pnpm, with caching, and install dependencies.
inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
