name: Bug report
description: Report a problem with lessons, tooling, or automation
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve Coding for MBA. Fill out the details below so we can reproduce the issue quickly.
  - type: input
    id: area
    attributes:
      label: Affected area
      description: e.g., Day_30 lesson script, MkDocs build, CI workflow
      placeholder: Lesson, docs, automation...
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Share the unexpected behavior and what you expected instead.
      placeholder: Describe the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include commands, inputs, or dataset references.
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste console output or attach screenshots to help triage.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I ran `make lint` or the relevant pre-commit hooks.
        - label: I ran `pytest` or lesson-specific tests (when available).
