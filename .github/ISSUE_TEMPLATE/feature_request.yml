name: Feature request
description: Propose a new capability, automation, or curriculum upgrade
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Tell us about the opportunity. What will this unlock for learners or contributors?
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short description of the proposed change.
      placeholder: Add BI dashboard export automation...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are we solving? Who is impacted?
      placeholder: Describe the pain point
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Outline the approach, key files, or API changes.
      placeholder: Share the plan or mock-ups
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies or related work
      description: Link discussions, pull requests, or lessons impacted by this change.
  - type: checkboxes
    id: readiness
    attributes:
      label: Ready for community collaboration?
      options:
        - label: I can help implement this change.
        - label: I need help and would like to pair or hand it off.
