name: Documentation CI/CD

on:
  push:
    branches: [main, feat/*, copilot/*]
  pull_request:
    branches: [main]

jobs:
  core-checks:
    uses: ./.github/workflows/ci-core.yml
    secrets: inherit

  build-docs:
    runs-on: ubuntu-latest
    needs: core-checks

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify lesson structure
      run: |
        if [ -f scripts/verify_lessons.py ]; then
          python scripts/verify_lessons.py
        else
          echo "⚠️  verify_lessons.py not found, skipping"
        fi

    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f docs/requirements-docs.txt ]; then
          pip install -r docs/requirements-docs.txt
        else
          pip install mkdocs mkdocs-material
        fi
        pip install linkchecker || echo "linkchecker not available"

    - name: Build documentation
      run: mkdocs build --strict

    - name: Check links (if linkchecker available)
      run: |
        if command -v linkchecker &> /dev/null; then
          linkchecker site/ --check-extern --ignore-url="github.com" || true
        fi
      continue-on-error: true

    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v4
      with:
        name: documentation-site
        path: site/
        retention-days: 30

  deploy-docs:
    runs-on: ubuntu-latest
    needs: build-docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f docs/requirements-docs.txt ]; then
          pip install -r docs/requirements-docs.txt
        else
          pip install mkdocs mkdocs-material
        fi

    - name: Build documentation
      run: mkdocs build --strict

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
        publish_branch: gh-pages
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Deploy documentation: ${{ github.event.head_commit.message }}'
