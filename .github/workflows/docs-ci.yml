name: Documentation CI/CD

on:
  push:
    branches: [main, feat/*, copilot/*]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-checks:
    uses: ./.github/workflows/ci-core.yml
    secrets: inherit

  build-docs:
    runs-on: ubuntu-latest
    needs: core-checks

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          requirements*.txt
          docs/requirements-docs.txt
          pyproject.toml

    - name: Verify lesson structure
      run: |
        if [ -f scripts/verify_lessons.py ]; then
          python scripts/verify_lessons.py
        else
          echo "⚠️  verify_lessons.py not found, skipping"
        fi

    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f docs/requirements-docs.txt ]; then
          pip install -r docs/requirements-docs.txt
        else
          pip install mkdocs mkdocs-material
        fi
        pip install linkchecker || echo "linkchecker not available"
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f pyproject.toml ]; then pip install -e . || echo "Skipping editable install"; fi

    - name: Build documentation
      run: mkdocs build --strict

    - name: Check links (if linkchecker available)
      run: |
        if command -v linkchecker &> /dev/null; then
          linkchecker site/ --check-extern --ignore-url="github.com" || true
        fi
      continue-on-error: true

    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v6
      with:
        name: documentation-site
        path: site/
        retention-days: 30

