name: Documentation CI/CD

on:
  push:
    branches: [main, feat/*, copilot/*]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Verify lesson structure
      run: |
        if [ -f scripts/verify_lessons.py ]; then
          python scripts/verify_lessons.py
        else
          echo "⚠️  verify_lessons.py not found, skipping"
        fi

    - name: Run tests
      run: |
        pytest --cov --cov-report=xml --cov-report=html

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        file: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false

    - name: Run linters
      run: |
        # Check formatting
        black --check scripts/ learner_backend/ || true
        ruff check scripts/ learner_backend/ || true

        # Spellcheck documentation
        codespell docs/ README.md || true

    - name: Build documentation
      run: |
        pip install -r docs/requirements-docs.txt || pip install mkdocs mkdocs-material
        mkdocs build --strict

    - name: Check links (if linkchecker available)
      run: |
        pip install linkchecker || echo "linkchecker not available"
        if command -v linkchecker &> /dev/null; then
          linkchecker site/ --check-extern --ignore-url="github.com" || true
        fi
      continue-on-error: true

    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v4
      with:
        name: documentation-site
        path: site/
        retention-days: 30

  deploy-docs:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r docs/requirements-docs.txt || pip install mkdocs mkdocs-material

    - name: Build documentation
      run: mkdocs build --strict

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
        publish_branch: gh-pages
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Deploy documentation: ${{ github.event.head_commit.message }}'
