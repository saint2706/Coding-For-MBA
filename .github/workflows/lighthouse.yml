name: Lighthouse CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required for actions/upload-artifact to publish Lighthouse reports.
  actions: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Bootstrap Node workspace
        uses: ./.github/actions/node-bootstrap

      - name: Build site
        run: VITE_BASE_PATH=/ npm run build

      - name: Serve dist
        run: |
          VITE_BASE_PATH=/ npm run preview -- --host 127.0.0.1 >/tmp/serve.log 2>&1 &
          npx --yes wait-on@8 http://127.0.0.1:4173

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun --config=./lighthouserc.json

      - name: Upload Lighthouse report artifact
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: lighthouse-report
          path: .lighthouseci
          if-no-files-found: warn
          retention-days: 7
