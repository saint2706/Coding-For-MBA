name: Nightly Smoke

on:
  schedule:
    # 03:00 UTC every weekday
    - cron: '0 3 * * 1-5'
  workflow_dispatch:
    inputs:
      run_playwright_smoke:
        description: 'Run optional Playwright Chromium smoke subset (@smoke)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  validate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Bootstrap Node workspace
        uses: ./.github/actions/node-bootstrap

      - name: Validate content
        run: npm run validate-content

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Bootstrap Node workspace
        uses: ./.github/actions/node-bootstrap

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Bootstrap Node workspace
        uses: ./.github/actions/node-bootstrap

      - name: Unit tests
        run: npm test

  smoke:
    needs: [validate-content, typecheck, unit-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Bootstrap Node workspace
        uses: ./.github/actions/node-bootstrap

      - name: Cache Playwright browsers
        if: ${{ github.event.inputs.run_playwright_smoke == 'true' || vars.RUN_NIGHTLY_PLAYWRIGHT_SMOKE == 'true' }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        if: ${{ github.event.inputs.run_playwright_smoke == 'true' || vars.RUN_NIGHTLY_PLAYWRIGHT_SMOKE == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke subset (Chromium)
        if: ${{ github.event.inputs.run_playwright_smoke == 'true' || vars.RUN_NIGHTLY_PLAYWRIGHT_SMOKE == 'true' }}
        run: npm run test:e2e -- --project=chromium --grep '@smoke' --pass-with-no-tests

      - name: Upload Playwright HTML report
        if: ${{ failure() && (github.event.inputs.run_playwright_smoke == 'true' || vars.RUN_NIGHTLY_PLAYWRIGHT_SMOKE == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-playwright-html-report
          path: playwright-report
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright traces
        if: ${{ failure() && (github.event.inputs.run_playwright_smoke == 'true' || vars.RUN_NIGHTLY_PLAYWRIGHT_SMOKE == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-playwright-traces
          path: test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Create or update failure issue
        if: ${{ failure() && github.event_name != 'pull_request' }}
        uses: actions/github-script@v9
        with:
          script: |
            const title = '🚨 Nightly smoke workflow failed';
            const marker = '<!-- nightly-smoke-failure -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\nThe nightly smoke workflow failed.\n\n- Workflow: ${context.workflow}\n- Run: ${runUrl}\n- Commit: ${context.sha}\n- Trigger: ${context.eventName}\n\nPlease investigate and close this issue when fixed.`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci,nightly-smoke',
              per_page: 100,
            });

            const existing = issues.find((issue) =>
              issue.title === title || (issue.body && issue.body.includes(marker))
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Another failure detected: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci', 'nightly-smoke'],
              });
            }

      - name: Close matching failure issues on success
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/github-script@v9
        with:
          script: |
            const title = '🚨 Nightly smoke workflow failed';
            const marker = '<!-- nightly-smoke-failure -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const closeComment = `Nightly smoke workflow succeeded: ${runUrl}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci,nightly-smoke',
              per_page: 100,
            });

            const matches = issues.filter((issue) =>
              issue.title === title || (issue.body && issue.body.includes(marker))
            );

            for (const issue of matches) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });

              const hasCloseComment = comments.some((comment) => comment.body === closeComment);
              if (!hasCloseComment) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: closeComment,
                });
              }

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
