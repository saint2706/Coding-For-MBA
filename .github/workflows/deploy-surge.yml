name: Deploy to Surge

on:
  schedule:
    # Every Sunday at 02:00 UTC — weekly canary refresh on surge.sh
    - cron: '0 2 * * 0'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap Node workspace
        uses: ./.github/actions/node-bootstrap

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Install Surge
        run: npm install --global surge@0.27.3

      - name: Deploy to Surge
        run: surge --project ./dist --domain coding-for-mba.surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
