name: docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            docs/requirements-docs.txt
            pyproject.toml
      - name: Install docs deps
        run: |
          python -m pip install -U pip
          if [ -f docs/requirements-docs.txt ]; then
            pip install -r docs/requirements-docs.txt
          else
            pip install mkdocs mkdocs-material
          fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || echo "Skipping editable install"; fi
      - name: Generate lesson pages
        run: |
          if [ -f tools/build_docs.py ]; then
            python tools/build_docs.py
          else
            echo "tools/build_docs.py not found, skipping pre-build step"
          fi
      - name: Build
        run: mkdocs build --strict
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
