name: Graphify Weekly Update

on:
  schedule:
    # 04:00 UTC every Monday
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install graphify
        run: pip install graphifyy

      - name: Run incremental graphify update
        run: python scripts/graphify_update.py

      - name: Commit and push updated graph
        run: |
          if git diff --quiet -- graphify-out; then
            echo "No graph changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add graphify-out
          git commit -m "chore: weekly graphify update"
          git push origin HEAD:main
