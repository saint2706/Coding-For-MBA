name: Deploy Certificates and PDFs

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual triggers

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          requirements*.txt
          pyproject.toml

    - name: Install system dependencies for WeasyPrint
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libpango-1.0-0 \
          libpangoft2-1.0-0 \
          libpangocairo-1.0-0 \
          libgdk-pixbuf2.0-0 \
          libffi-dev \
          shared-mime-info

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f pyproject.toml ]; then pip install -e . || echo "Skipping editable install"; fi

    - name: Generate all PDFs
      run: |
        if [ -f scripts/generate_pdfs.py ]; then
          python scripts/generate_pdfs.py --all
        else
          echo "scripts/generate_pdfs.py not found, skipping"
        fi

    - name: Generate badges
      run: |
        if [ -f scripts/generate_badge.py ]; then
          python scripts/generate_badge.py --all
        else
          echo "scripts/generate_badge.py not found, skipping"
        fi

    - name: List generated artifacts
      run: |
        echo "=== Generated PDFs ==="
        ls -lh artifacts/*.pdf || echo "No PDFs found"
        echo ""
        echo "=== Generated Bundles ==="
        ls -lh artifacts/bundles/*.zip || echo "No bundles found"
        echo ""
        echo "=== Generated Badges ==="
        ls -lh generated/badges/*.svg || echo "No badges found"

    - name: Upload PDFs to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/curriculum_full.pdf
          artifacts/curriculum_phase_*.pdf
          artifacts/bundles/*.zip
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts (manual workflow_dispatch)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v5
      with:
        name: curriculum-pdfs-and-bundles
        path: |
          artifacts/curriculum_full.pdf
          artifacts/curriculum_phase_*.pdf
          artifacts/bundles/*.zip
          generated/badges/*.svg
        retention-days: 90
