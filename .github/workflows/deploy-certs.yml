name: Deploy Certificates and PDFs

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual triggers

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies for WeasyPrint
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libpango-1.0-0 \
          libpangoft2-1.0-0 \
          libpangocairo-1.0-0 \
          libgdk-pixbuf2.0-0 \
          libffi-dev \
          shared-mime-info

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Generate all PDFs
      run: |
        python scripts/generate_pdfs.py --all

    - name: Generate badges
      run: |
        python scripts/generate_badge.py --all

    - name: List generated artifacts
      run: |
        echo "=== Generated PDFs ==="
        ls -lh artifacts/*.pdf || echo "No PDFs found"
        echo ""
        echo "=== Generated Bundles ==="
        ls -lh artifacts/bundles/*.zip || echo "No bundles found"
        echo ""
        echo "=== Generated Badges ==="
        ls -lh generated/badges/*.svg || echo "No badges found"

    - name: Upload PDFs to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/curriculum_full.pdf
          artifacts/curriculum_phase_*.pdf
          artifacts/bundles/*.zip
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts (manual workflow_dispatch)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v5
      with:
        name: curriculum-pdfs-and-bundles
        path: |
          artifacts/curriculum_full.pdf
          artifacts/curriculum_phase_*.pdf
          artifacts/bundles/*.zip
          generated/badges/*.svg
        retention-days: 90
