name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - language: javascript-typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      # For this Vite + TypeScript project we run an explicit build instead of autobuild
      # so CodeQL analyzes the same graph used by CI releases.
      - name: Bootstrap Node workspace
        uses: ./.github/actions/node-bootstrap

      - name: Build project
        run: npm run build

      - name: Perform CodeQL Analysis
        # Code scanning / GitHub Advanced Security isn't enabled for this repo
        # (Settings > Security > Code security and analysis), so SARIF upload
        # currently errors out regardless of the scan results. Don't let that
        # block PRs; re-enable as a blocking gate once the setting is on.
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
