name: Python CI

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - '**.ipynb'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.py'
      - '**.ipynb'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'Makefile'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    uses: ./.github/workflows/ci-core.yml
    secrets: inherit
