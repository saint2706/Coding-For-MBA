name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bootstrap Node workspace
        uses: ./.github/actions/node-bootstrap

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run lint:ci

  validate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bootstrap Node workspace
        uses: ./.github/actions/node-bootstrap

      - name: Validate content
        run: npm run validate-content

  unit-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bootstrap Node workspace
        uses: ./.github/actions/node-bootstrap
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test with coverage threshold
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          mkdir -p test-results coverage
          npm run test:coverage -- \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=./test-results/vitest-junit.xml \
            --coverage.reporter=text \
            --coverage.reporter=html \
            --coverage.reporter=lcov \
            --coverage.reporter=cobertura

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: test-results/vitest-junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: |
            coverage/lcov.info
            coverage/cobertura-coverage.xml
            coverage/index.html
            coverage/**
          if-no-files-found: warn
          retention-days: 14
