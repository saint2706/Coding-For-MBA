name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dependency Review
        # Repo-wide Dependency graph / GitHub Advanced Security isn't enabled
        # (Settings > Security > Code security and analysis), so this action
        # currently errors out before it can check anything. Don't let that
        # block PRs; re-enable as a blocking gate once the setting is on.
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          license-check: true
          vulnerability-check: true
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0
