name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    # Disabled: this action requires Dependency graph / GitHub Advanced
    # Security, which isn't enabled for this repo (Settings > Security >
    # Code security and analysis). It errors out before checking anything,
    # so it can't function as a gate. Remove this `if: false` once that
    # setting is turned on.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          license-check: true
          vulnerability-check: true
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0
