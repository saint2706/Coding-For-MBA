name: Lesson Performance Benchmarks

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || echo "Skipping editable install"; fi

      - name: Run lesson benchmarks
        run: |
          python tools/benchmark_lessons.py --repeats 5 --output benchmark-results.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@v6
        with:
          name: lesson-benchmarks
          path: benchmark-results.json
          if-no-files-found: error
