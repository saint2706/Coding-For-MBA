questions:
  - question: "What is a DataFrame in Pandas?"
    options:
      - "A single column of data"
      - "A 2-dimensional labeled data structure"
      - "A Python list"
      - "A database table"
    answer: 1
    explanation: "A DataFrame is a 2-dimensional labeled data structure with columns of potentially different types."

  - question: "Which method would you use to read a CSV file in Pandas?"
    options:
      - "pd.load_csv()"
      - "pd.import_csv()"
      - "pd.read_csv()"
      - "pd.get_csv()"
    answer: 2
    explanation: "pd.read_csv() is the standard method to read CSV files into a DataFrame."

  - question: "How do you select a column named 'Sales' from a DataFrame df?"
    options:
      - "df.get('Sales')"
      - "df['Sales']"
      - "df.select('Sales')"
      - "df->Sales"
    answer: 1
    explanation: "Column selection in Pandas uses bracket notation: df['column_name']"

  - question: "What does df.head() do?"
    options:
      - "Returns the first row only"
      - "Returns column headers"
      - "Returns the first 5 rows by default"
      - "Returns summary statistics"
    answer: 2
    explanation: "df.head() returns the first 5 rows of the DataFrame by default."

  - question: "Which method groups data by a column for aggregation?"
    options:
      - "df.aggregate()"
      - "df.group()"
      - "df.groupby()"
      - "df.cluster()"
    answer: 2
    explanation: "df.groupby() is used to group data by one or more columns for aggregation."

