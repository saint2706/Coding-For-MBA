site_name: Coding for MBA
site_url: https://saint2706.github.io/Coding-For-MBA/
repo_url: https://github.com/saint2706/Coding-For-MBA
edit_uri: edit/main/docs/
theme:
  name: material
  custom_dir: docs/overrides
  language: en
  features:
  - navigation.instant
  - navigation.tracking
  - navigation.tabs
  - navigation.sections
  - toc.follow
  - content.code.copy
  - content.action.edit
  - search.suggest
  - search.highlight
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
plugins:
- search
- tags
- mkdocs-jupyter:
    execute: false
    include_source: true
- redirects
- minify:
    minify_html: true
extra_css:
- stylesheets/extra.css
- stylesheets/interactive-widgets.css
extra_javascript:
- https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js
- javascripts/pyodide-console.js
- javascripts/progress-tracker.js
- assets/js/progress.js
markdown_extensions:
- admonition
- footnotes
- attr_list
- def_list
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight
- pymdownx.tabbed:
    alternate_style: true
