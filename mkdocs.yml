site_name: Coding for MBA
site_url: https://saint2706.github.io/Coding-For-MBA/
repo_url: https://github.com/saint2706/Coding-For-MBA
theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
plugins:
  - search
  - tags
  - mkdocs-jupyter:
      execute: false
      include_source: true
  - redirects
  - minify:
      minify_html: true
markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Home: index.md
  - Get Started: get-started.md
  - Phases:
      - Overview: phases/overview.md
      - "Phase 5 • Business Intelligence": phases/phase5.md
  - Lessons:
      - All Lessons: lessons/_index.md
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/saint2706/Coding-For-MBA
  generator: false
validation:
  omitted_files: ignore
  absolute_links: ignore
  unrecognized_links: ignore
